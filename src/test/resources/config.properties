# ParaBank base URLs
base.url=https://parabank.parasoft.com/parabank
api.base.url=https://parabank.parasoft.com/parabank/services/bank

# Browser settings
browser=chromium
headless=true
default.timeout=30000

# Transfer amount used in the E2E flow
transfer.amount=250.00

# H2 simulated banking DB (local only — ParaBank cloud DB is not publicly exposed)
db.url=jdbc:h2:mem:parabank_qa;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
